name: OKF Agent Skills dogfood

on:
  pull_request:
    paths:
      - '*/SKILL.md'
      - '*/references/**'
      - '*/scripts/**'
      - '*/assets/**'
      - '*/examples/**'
      - '*/evals/**'
      - 'okf-agent-skills/**'
      - '.github/workflows/okf-agent-skills-dogfood.yml'
  workflow_dispatch:

jobs:
  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Project repository skills to typed OKF IR
        run: |
          set -o pipefail
          mkdir -p dogfood
          python okf-agent-skills/scripts/project.py . "$RUNNER_TEMP/skills-okf" | tee dogfood/projector.txt
          cp -R "$RUNNER_TEMP/skills-okf" dogfood/projection

      - name: Inspect projection with current okf-parser
        run: |
          set -o pipefail
          OKF="uvx --from git+https://github.com/franklinbaldo/okf-parser.git okf-parser"
          SPEC='.okf/contracts/{slug}.md'
          $OKF --help > dogfood/okf-parser-help.txt
          $OKF check "$RUNNER_TEMP/skills-okf" 2>&1 | tee dogfood/check.txt
          $OKF inventory "$RUNNER_TEMP/skills-okf" 2>&1 | tee dogfood/inventory.txt
          $OKF graph "$RUNNER_TEMP/skills-okf" 2>&1 | tee dogfood/graph.txt
          $OKF schema "$RUNNER_TEMP/skills-okf" --format json --spec-template "$SPEC" 2>&1 | tee dogfood/schema.json
          $OKF duckdb "$RUNNER_TEMP/skills-okf" dogfood/skills.duckdb okf --overwrite --spec-template "$SPEC" 2>&1 | tee dogfood/duckdb.txt

      - name: Assert declared DuckDB types
        run: |
          set -o pipefail
          uv run --no-project --with duckdb python - <<'PY' | tee dogfood/typed-contracts.txt
          import duckdb

          con = duckdb.connect('dogfood/skills.duckdb', read_only=True)
          rows = con.execute("""
              SELECT table_name, column_name, data_type
              FROM duckdb_columns()
              WHERE schema_name = 'okf_types'
              ORDER BY table_name, column_index
          """).fetchall()
          for row in rows:
              print('\t'.join(map(str, row)))

          types = {(table, column): dtype for table, column, dtype in rows}
          expected = {
              ('Skill', 'line_count'): 'INTEGER',
              ('SkillResource', 'size_bytes'): 'UBIGINT',
              ('SkillRelation', 'source_line'): 'INTEGER',
              ('SkillRelation', 'resolved'): 'BOOLEAN',
              ('SkillEval', 'case_index'): 'INTEGER',
              ('SkillEval', 'should_trigger'): 'BOOLEAN',
              ('SkillMention', 'source_line'): 'INTEGER',
          }
          missing = {key: value for key, value in expected.items() if types.get(key) != value}
          if missing:
              raise SystemExit(f'declared type mismatch: {missing}; observed={types}')
          print(f'asserted_declared_types={len(expected)}')
          PY

      - name: Materialize canonical typed audit views
        run: |
          set -o pipefail
          uv run --no-project --with duckdb python okf-agent-skills/scripts/run_typed_audit.py \
            dogfood/skills.duckdb --output dogfood/audit.json
          cat dogfood/audit.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('dogfood/audit.json').read_text(encoding='utf-8'))
          coverage = report['eval_coverage']
          if len(coverage) != 24:
              raise SystemExit(f'expected audit coverage row for each of 24 skills, got {len(coverage)}')
          covered = [row for row in coverage if row['has_routing_evals']]
          uncovered = [row for row in coverage if not row['has_routing_evals']]
          if not covered or not uncovered:
              raise SystemExit('routing coverage audit must distinguish covered and uncovered skills')
          print(f'audit_views={len(report)}')
          print(f'eval_covered_skills={len(covered)}')
          print(f'eval_uncovered_skills={len(uncovered)}')
          print(f'mentions_without_edge={len(report["mentions_without_edge"])}')
          print(f'isolated_skills={len(report["isolated_skills"])}')
          PY

      - name: Summarize projected corpus
        run: |
          set -o pipefail
          python - <<'PY' | tee dogfood/summary.txt
          from collections import defaultdict
          from pathlib import Path
          import re

          root = Path('dogfood/projection')
          skills = sorted((root / 'skills').glob('*.md'))
          resources = sorted((root / 'resources').glob('*.md'))
          relations = sorted((root / 'relations').glob('*.md'))
          evals = sorted((root / 'evals').glob('*.md'))
          mentions = sorted((root / 'mentions').glob('*.md'))
          contracts = sorted((root / '.okf' / 'contracts').glob('*.schema.sql'))

          resolved = 0
          unresolved = 0
          for path in relations:
              text = path.read_text(encoding='utf-8')
              if re.search(r'^resolved: true$', text, re.M):
                  resolved += 1
              else:
                  unresolved += 1

          line_counts = []
          for path in skills:
              text = path.read_text(encoding='utf-8')
              match = re.search(r'^line_count: (\d+)$', text, re.M)
              source = re.search(r'^source_path: "([^"]+)"$', text, re.M)
              if match and source:
                  line_counts.append((int(match.group(1)), source.group(1)))

          coverage = defaultdict(lambda: {'positive': 0, 'negative': 0})
          for path in evals:
              text = path.read_text(encoding='utf-8')
              skill = re.search(r'^skill: "([^"]+)"$', text, re.M)
              trigger = re.search(r'^should_trigger: (true|false)$', text, re.M)
              if skill and trigger:
                  key = 'positive' if trigger.group(1) == 'true' else 'negative'
                  coverage[skill.group(1)][key] += 1

          mention_pairs = set()
          for path in mentions:
              text = path.read_text(encoding='utf-8')
              source = re.search(r'^source_skill: "([^"]+)"$', text, re.M)
              target = re.search(r'^target_skill: "([^"]+)"$', text, re.M)
              if source and target:
                  mention_pairs.add((source.group(1), target.group(1)))

          eval_resources = 0
          for path in resources:
              text = path.read_text(encoding='utf-8')
              if re.search(r'^kind: "eval"$', text, re.M):
                  eval_resources += 1

          print(f'skills={len(skills)}')
          print(f'resources={len(resources)}')
          print(f'relations={len(relations)}')
          print(f'evals={len(evals)}')
          print(f'eval_resources={eval_resources}')
          print(f'mentions={len(mentions)}')
          print(f'mention_pairs={len(mention_pairs)}')
          print(f'declared_type_contracts={len(contracts)}')
          print(f'eval_covered_skills={len(coverage)}')
          print(f'eval_uncovered_skills={len(skills) - len(coverage)}')
          print(f'resolved_projected_relations={resolved}')
          print(f'unresolved_local_relations={unresolved}')
          print('routing_eval_coverage:')
          for skill in sorted(coverage):
              counts = coverage[skill]
              print(f"  {skill}: +{counts['positive']} / -{counts['negative']}")
          print('largest_skills:')
          for count, source in sorted(line_counts, reverse=True)[:10]:
              print(f'  {count:4d}  {source}')
          PY

      - name: Upload dogfood evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: okf-agent-skills-dogfood
          path: dogfood/
          if-no-files-found: error
