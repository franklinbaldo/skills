name: MBQL DuckDB corpus audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "mbql/**"
      - ".github/workflows/mbql-duckdb-corpus.yml"
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout skills
        uses: actions/checkout@v4

      - name: Checkout DuckDB SQL tests
        uses: actions/checkout@v4
        with:
          repository: duckdb/duckdb
          path: upstream/duckdb
          fetch-depth: 1
          sparse-checkout: |
            test/sql
          sparse-checkout-cone-mode: true

      - uses: astral-sh/setup-uv@v5

      - name: Classify DuckDB SQLLogicTest corpus
        id: audit
        shell: bash
        run: |
          set +e
          uv run --quiet mbql/scripts/corpus_runner.py \
            upstream/duckdb/test/sql \
            --database Corpus \
            > mbql-duckdb-corpus.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "corpus_runner_exit=$code" >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          payload = json.loads(Path("mbql-duckdb-corpus.json").read_text())
          print("## DuckDB → MBQL corpus audit")
          print(f"Statements: {payload['statements']}")
          print(f"Contract gaps: {payload['contract_gaps']}")
          print(f"Classification gaps: {payload['classification_gaps']}")
          print(f"Parse errors: {payload['parse_errors']}")

          print("\n### Status counts")
          for key, value in sorted(payload["counts"].items()):
              print(f"- {key}: {value}")

          print("\n### Top language features")
          for key, value in sorted(payload["feature_counts"].items(), key=lambda kv: (-kv[1], kv[0]))[:25]:
              print(f"- {key}: {value}")

          print("\n### Driver capabilities required")
          for key, value in sorted(payload["driver_feature_counts"].items(), key=lambda kv: (-kv[1], kv[0])):
              print(f"- {key}: {value}")
          PY
          exit 0

      - name: Upload corpus report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mbql-duckdb-corpus
          path: mbql-duckdb-corpus.json
          if-no-files-found: error

      # A auditoria do corpus upstream é exploratória: mede o backlog de
      # classificação (contract_gap / classification_gap) sem bloquear a PR.
      # Os gates que bloqueiam são as suítes da skill (skill-tests.yml).
      - name: Report conformance backlog
        if: always()
        shell: bash
        run: |
          code="${{ steps.audit.outputs.exit_code }}"
          if [ -z "$code" ]; then
            echo "Corpus audit did not produce an exit code" >&2
            exit 1
          fi
          if [ "$code" != "0" ]; then
            echo "::warning title=MBQL corpus backlog::corpus_runner saiu com $code; veja o resumo e o artifact mbql-duckdb-corpus"
          fi
