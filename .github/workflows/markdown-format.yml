name: Markdown format

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".mdformat.toml"
      - "scripts/check_markdown_format.py"
      - ".github/workflows/markdown-format.yml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".mdformat.toml"
      - "scripts/check_markdown_format.py"
      - ".github/workflows/markdown-format.yml"

permissions:
  contents: read

jobs:
  mdformat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Check formatting
        # No --base flag: the script reads GITHUB_ACTIONS/GITHUB_BASE_REF
        # itself and picks the right diff base for pull_request vs push.
        run: uv run scripts/check_markdown_format.py
