name: Markdown format

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".mdformat.toml"
      - "scripts/check_markdown_format.py"
      - ".github/workflows/markdown-format.yml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".mdformat.toml"
      - "scripts/check_markdown_format.py"
      - ".github/workflows/markdown-format.yml"

permissions:
  contents: read

jobs:
  mdformat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Diagnose formatting
        run: |
          uv run scripts/check_markdown_format.py --fix --files toe-arena-tiering/SKILL.md
          git diff -- toe-arena-tiering/SKILL.md
          exit 1
