name: Ruff

on:
  pull_request:
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "ruff.toml"
      - ".ruff.toml"
      - ".github/workflows/ruff.yml"
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "ruff.toml"
      - ".ruff.toml"
      - ".github/workflows/ruff.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format=github
