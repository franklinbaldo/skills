name: Skill helper tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test size gate
        run: python -m unittest discover -s tests -p test_file_token_limit.py
      - name: File size gate (changed files)
        env:
          TOKEN_LIMIT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/check_file_token_limit.py
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Run okf-agent-skills tests
        run: |
          for test in okf-agent-skills/tests/test_*.py; do
            uv run --quiet "$test"
          done
      - name: Run CLI contract tests
        run: uv run --quiet tests/test_cli_contracts.py
      - name: Run script regression tests
        run: |
          uv run --quiet anonimizacao-documentos/scripts/test_anonimizacao.py
          uv run --quiet free-gpu/scripts/test_free_gpu.py
          uv run --quiet convert-to-pdfa/scripts/test_pikepdf_backend.py
          uv run --quiet convert-to-pdfa/scripts/test_convert_to_pdfa.py
          uv run --quiet convert-to-pdfa/scripts/test_subprocess_decoding.py
          uv run --quiet pdf-to-markdown/scripts/test_convert_pdf.py
          uv run --quiet consulta-dare-sefin/scripts/test_consultar_dare.py
      - name: Run DataJud SQLite regression tests
        run: uv run --with pytest --with fastmcp --with cyclopts --with pydantic --with rich -- pytest -q datajud/tests

