name: Skill helper tests

on:
  pull_request:
    paths:
      - "**/*.py"
      - "*/SKILL.md"
      - "tests/**"
      - "okf-agent-skills/**"
      - ".github/workflows/skill-tests.yml"
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "*/SKILL.md"
      - "tests/**"
      - "okf-agent-skills/**"
      - ".github/workflows/skill-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Run okf-agent-skills tests
        run: |
          for test in okf-agent-skills/tests/test_*.py; do
            uv run --quiet "$test"
          done
      - name: Run CLI contract tests
        run: uv run --quiet tests/test_cli_contracts.py
      - name: Run script regression tests
        run: |
          uv run --quiet anonimizacao-documentos/scripts/test_anonimizacao.py
          uv run --quiet free-gpu/scripts/test_free_gpu.py
          uv run --quiet convert-to-pdfa/scripts/test_convert_to_pdfa.py
          uv run --quiet convert-to-pdfa/scripts/test_subprocess_decoding.py
          uv run --quiet pdf-to-markdown/scripts/test_convert_pdf.py
