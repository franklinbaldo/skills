name: File token limit
on:
  pull_request:
    types: [opened, synchronize, reopened, submitted, review_requested, ready_for_review]
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
jobs:
  token-limit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'tiktoken>=0.8,<1'
      - name: Check all tracked text files
        run: python scripts/check_file_token_limit.py
      - name: Require independent human approval for whitelist changes
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python - <<'PY'
          import json, os, subprocess, urllib.request
          policy = ".token-limit-exceptions.json"
          changed = subprocess.check_output(["git", "diff", "--name-only", os.environ["BASE_SHA"], os.environ["HEAD_SHA"]], text=True).splitlines()
          if policy not in changed:
              raise SystemExit(0)
          url = f"https://api.github.com/repos/{os.environ['REPO']}/pulls/{os.environ['PR']}/reviews?per_page=100"
          req = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"})
          with urllib.request.urlopen(req) as response:
              reviews = json.load(response)
          # A prior approval does not suffice for a later modification to policy:
          # protect this check with mandatory fresh approvals / dismiss stale approvals.
          approval = any(r.get("state") == "APPROVED" and r.get("user", {}).get("type") == "User" and r["user"]["login"] != os.environ["AUTHOR"] and r.get("commit_id") == os.environ["HEAD_SHA"] for r in reviews)
          if not approval:
              raise SystemExit("Whitelist changes require approval by a distinct human GitHub user on the current head commit.")
          PY
