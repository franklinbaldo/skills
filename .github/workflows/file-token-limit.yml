name: File size limit
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  file-size-ratchet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test file-size policy\n        run: python -m unittest discover -s tests -p test_file_token_limit.py\n      - name: Check changed source files (20,000 bytes)
        env:
          TOKEN_LIMIT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/check_file_token_limit.py
