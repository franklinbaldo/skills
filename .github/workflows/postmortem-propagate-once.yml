name: One-shot skill postmortem propagation

on:
  push:
    branches:
      - cleanup/production-self-report-loop
    paths:
      - '.github/workflows/postmortem-propagate-once.yml'

permissions:
  contents: write

jobs:
  propagate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/production-self-report-loop

      - name: Append postmortem contract to every skill
        run: |
          python - <<'PY'
          from pathlib import Path

          footer = '''

## Real-use postmortem

After any material use of this skill, perform a brief self-postmortem before ending the task:
assess whether routing was correct, whether the skill materially improved/neutral/degraded the
result, what concrete instruction mattered, and any friction or workaround. Routine success
stays ephemeral. If there is actionable learning, search `franklinbaldo/skills` issues and add
evidence to an existing matching issue or open a sanitized **Skill use feedback** issue. Never
publish secrets, private/confidential facts, credentials, or personal data, and do not interrupt
the user's task merely to report feedback.
'''

          changed = []
          for path in sorted(Path('.').glob('*/SKILL.md')):
              if path.as_posix() == 'loop-engineering/SKILL.md':
                  continue
              text = path.read_text(encoding='utf-8')
              if '## Real-use postmortem' in text or '## Mandatory postmortem' in text:
                  continue
              path.write_text(text.rstrip() + footer, encoding='utf-8')
              changed.append(path.as_posix())
          print(f'updated={len(changed)}')
          for path in changed:
              print(path)
          PY

      - name: Remove this workflow and commit propagated contract
        run: |
          rm .github/workflows/postmortem-propagate-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git diff --cached --quiet && exit 0
          git commit -m 'docs(skills): require real-use postmortem self-report'
          git push
