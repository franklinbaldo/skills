name: PEP 723 migration

on:
  push:
    branches: [chore/pep-723-standalone-scripts]
    paths:
      - "scripts/_pep723_inventory.py"
      - ".github/workflows/pep723-inventory.yml"

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply PEP 723 metadata
        run: python scripts/_pep723_inventory.py
      - name: Validate patch hygiene
        run: git diff --check
      - name: Publish migration changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -u
          git commit -m "chore: make standalone Python scripts PEP 723 self-contained" || exit 0
          git push
