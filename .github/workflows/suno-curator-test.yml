name: Suno Skills Tests

on:
  push:
    branches: [ main ]
    paths:
      - "suno-curator/**"
      - "suno-profile/**"
  pull_request:
    branches: [ main ]
    paths:
      - "suno-curator/**"
      - "suno-profile/**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Run suno-curator offline audit fixtures
      run: node --test suno-curator/scripts/audit-catalog.test.mjs

    - name: Type-check suno-profile scripts
      run: |
        node --check suno-profile/scripts/gemini-audio-critic.mjs
        node --check suno-profile/scripts/keyring.mjs
        node --check suno-profile/scripts/mint-bearer-token.mjs
        node --check suno-profile/scripts/login-and-capture.mjs
        node --check suno-profile/scripts/clerk-constants.mjs
        node --check suno-profile/scripts/export-catalog.mjs
        node --check suno-profile/scripts/ask-gemini.mjs

    - name: Run suno-profile offline fixtures
      run: |
        node --test suno-profile/scripts/gemini-audio-critic.test.mjs
        node --test suno-profile/scripts/export-catalog.test.mjs
        node --test suno-profile/scripts/ask-gemini.test.mjs
