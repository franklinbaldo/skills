name: Suno Curator Tests

on:
  push:
    branches: [ main ]
    paths:
      - "suno-curator/**"
  pull_request:
    branches: [ main ]
    paths:
      - "suno-curator/**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Run offline audit fixtures
      run: node --test suno-curator/scripts/audit-catalog.test.mjs
