# Configuração compartilhada de tooling Python do repositório.
#
# Este repositório não é um pacote: cada script de skill é autocontido via
# PEP 723 e roda com `uv run <script>`. O arquivo existe apenas para
# centralizar a configuração do Ruff.

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sys.argv" = { msg = "Use Cyclopts para interpretar argumentos de linha de comando." }
