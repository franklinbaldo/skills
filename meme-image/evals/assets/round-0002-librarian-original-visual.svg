<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Two musical genres playing in separate rooms of an infinite library</title>
  <desc id="desc">A hexagonal library corridor splits into two rehearsal rooms. One room contains progressive-rock symbols and the other baião percussion. Their sound waves stop at the wall instead of combining.</desc>
  <rect width="960" height="540" fill="white"/>
  <g stroke="#111" fill="none" stroke-width="2">
    <path d="M80 95 L250 35 L420 95 L420 445 L250 505 L80 445 Z"/>
    <path d="M540 95 L710 35 L880 95 L880 445 L710 505 L540 445 Z"/>
    <line x1="480" y1="55" x2="480" y2="485" stroke-width="6"/>
    <g stroke-width="1.3" opacity="0.7">
      <line x1="105" y1="135" x2="395" y2="135"/><line x1="105" y1="180" x2="395" y2="180"/>
      <line x1="105" y1="360" x2="395" y2="360"/><line x1="105" y1="405" x2="395" y2="405"/>
      <line x1="565" y1="135" x2="855" y2="135"/><line x1="565" y1="180" x2="855" y2="180"/>
      <line x1="565" y1="360" x2="855" y2="360"/><line x1="565" y1="405" x2="855" y2="405"/>
    </g>
    <path d="M145 280 C180 235 210 325 245 280 S310 235 350 280" stroke-width="5"/>
    <path d="M605 280 l28 -48 l28 48 l28 -48 l28 48 l28 -48 l28 48" stroke-width="5"/>
    <path d="M365 280 C405 250 435 250 465 280" stroke-dasharray="8 7"/>
    <path d="M595 280 C555 250 525 250 495 280" stroke-dasharray="8 7"/>
  </g>
  <g font-family="system-ui, sans-serif" fill="#111" text-anchor="middle">
    <text x="250" y="118" font-size="24">PROG ROCK</text>
    <text x="710" y="118" font-size="24">BAIÃO</text>
    <text x="250" y="330" font-size="17">odd meters · distorted guitars</text>
    <text x="710" y="330" font-size="17">triangle · pulse · body</text>
    <text x="480" y="28" font-size="23">“fusion”</text>
    <text x="480" y="520" font-size="21">two songs, separate rooms</text>
  </g>
</svg>
