[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "franklin-mbql"
version = "0.1.0"
description = "Strict SQLGlot to portable Metabase MBQL 5 converter"
requires-python = ">=3.11"
dependencies = ["sqlglot>=27,<29", "cyclopts>=3"]

[tool.setuptools]
py-modules = ["sql_to_mbql"]

[tool.setuptools.package-dir]
"" = "scripts"
